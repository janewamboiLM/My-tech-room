<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="url" content="https://janewamboiLM.github.io">
    <meta name="copyright" content="Jane Wamboi">
    <meta name="robots" content="index,follow">
    <title>Jane Wamboi ~ Backend Developer | Cloud & Kubernetes</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="images/favicon/fav.png">
    <link rel="apple-touch-icon" sizes="144x144" type="image/x-icon" href="images/favicon/apple-touch-icon.png" />
    <!-- All CSS Plugins -->
    <link rel="stylesheet" type="text/css" href="css/plugin.css" />
    <!-- Main CSS Stylesheet -->
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <!-- New Layout Theme CSS -->
    <link rel="stylesheet" type="text/css" href="css/modern-theme.css" />
    <!-- Matrix Canvas Stylesheet -->
    <link rel="stylesheet" type="text/css" href="css/matrix.css" />
    <!-- Google Web Fonts  -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="description"
        content='Jane Wamboi is a Backend Developer specializing in Cloud Computing and Kubernetes. Building scalable backend systems and contributing to open source backend projects.'>
    <meta name="twitter:card" content='images/favicon/fav.png'>
    <meta name="twitter:site" content="https://github.com/janewamboiLM">
    <meta name="twitter:title" content="Jane Wamboi - Backend Developer | Cloud & Kubernetes">
    <meta name="twitter:description"
        content='Backend Developer specializing in Python, Java, Go, Node.js, Kubernetes, and Cloud Computing. Active open source contributor.'>
    <meta name="twitter:creator" content="https://github.com/janewamboiLM">
    <meta name="twitter:image" content="images/favicon/fav.png">
    <meta name="twitter:domain" content="https://github.com/janewamboiLM">
    <meta name="keywords"
        content="Jane Wamboi, Backend Developer, Python, Java, Go, Node.js, Kubernetes, Docker, AWS, Azure, GCP, Microservices, REST APIs, Open Source">
</head>

<body onload="initializeProfile();">
    <!--Matrix Canvas Background-->
    <canvas id="c" class="matrix"></canvas>

    <!-- Main Wrapper -->
    <div class="site-wrapper">
        <!-- Hero Banner -->
        <div class="hero-banner">
            <div class="banner-content">
                <h1 class="hero-name" id="profile-name">Jane Wamboi</h1>
                <h2 class="hero-title" id="profile-title">Backend Developer</h2>
                <p class="hero-quote">The quieter you become the more you are able to hear</p>
                
                <!-- Social Links -->
                <div class="hero-social" id="social-links">
                    <a href="#" target="_blank" class="social-icon github" id="github-link" style="display: none;" title="GitHub">
                        <i class="fa fa-github"></i>
                    </a>
                    <a href="#" target="_blank" class="social-icon linkedin" id="linkedin-link" style="display: none;" title="LinkedIn">
                        <i class="fa fa-linkedin"></i>
                    </a>
                    <a href="#" target="_blank" class="social-icon medium" id="medium-link" style="display: none;" title="Medium">
                        <i class="fa fa-medium"></i>
                    </a>
                    <a href="#" target="_blank" class="social-icon twitter" id="twitter-link" style="display: none;" title="Twitter">
                        <i class="fa fa-twitter"></i>
                    </a>
                    <a href="#" target="_blank" class="social-icon email" id="email-link" style="display: none;" title="Email">
                        <i class="fa fa-envelope-o"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Side Section -->
            <aside class="side-section">
                <!-- Education -->
                <div class="side-card">
                    <div class="card-title">
                        <i class="fa fa-graduation-cap"></i>
                        <h3>Education</h3>
                    </div>
                    <div class="card-body">
                        <span class="badge" id="education-status">Professional</span>
                        <h4 class="card-main" id="education-institution">Backend Development</h4>
                        <p class="card-sub" id="education-degree">Backend Development</p>
                    </div>
                </div>

                <!-- Experience -->
                <div class="side-card" id="experience-section" style="display: none;">
                    <div class="card-title">
                        <i class="fa fa-briefcase"></i>
                        <h3>Experience</h3>
                    </div>
                    <div class="card-body">
                        <p class="exp-years" id="experience-display"></p>
                        <p class="exp-label">Years in Backend Development</p>
                    </div>
                </div>
            </aside>

            <!-- Content Section -->
            <div class="content-section">
                <!-- Skills -->
                <section class="content-card skills-card">
                    <div class="card-heading">
                        <i class="fa fa-server"></i>
                        <h2>Skills & Technologies</h2>
                    </div>
                    <div class="card-content">
                        <div class="skills-wrapper" id="skills-container">
                            <!-- Skills will be populated by JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Open Source -->
                <section class="content-card opensource-card" id="opensource-section" style="display: none;">
                    <div class="card-heading">
                        <i class="fa fa-github-alt"></i>
                        <h2>Open Source Contributions</h2>
                    </div>
                    <div class="card-content">
                        <p class="card-text" id="opensource-description"></p>
                        <div class="projects-wrapper" id="projects-container">
                            <!-- Projects will be populated by JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Interests -->
                <section class="content-card interests-card">
                    <div class="card-heading">
                        <i class="fa fa-heart"></i>
                        <h2>Interests</h2>
                    </div>
                    <div class="card-content">
                        <div class="interests-wrapper" id="interests-container">
                            <!-- Interests will be populated by JavaScript -->
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- All Javascript Plugins  -->
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/plugin.js"></script>
    <!-- Profile Configuration -->
    <script type="text/javascript" src="js/config.js"></script>
    <!-- Main Javascript File  -->
    <script type="text/javascript" src="js/scripts.js"></script>
</body>

</html>
